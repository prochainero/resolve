<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>有機化學爭點本</title>
<style>
:root{--bg:#f3f5f2;--fg:#17201c;--card:#fff;--mut:#66716b;--acc:#1f6f5c;--on:#fff;--bd:#d8ded9;--me:#dcebe5;--warn:#a4452c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--fg:#e8eeea;--card:#1c2420;--mut:#93a09a;--acc:#5fc4a6;--on:#0b1410;--bd:#2c3731;--me:#25382f;--warn:#e58a6c}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 system-ui,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--fg);padding-bottom:84px}
main{max-width:720px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:14px 0;font-size:16px;background:none;border:0;color:var(--mut);font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:0 0 12px}
button.b,label.b{display:inline-block;background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:13px 18px;font-size:16px;font-weight:600;cursor:pointer;text-align:center}
button.g{background:none;color:var(--acc);border:1px solid var(--acc)}
button:disabled{opacity:.5}
input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{white-space:pre-wrap;padding:11px 13px;border-radius:10px;margin:0 0 10px;max-width:94%;background:var(--card);border:1px solid var(--bd)}
.msg.me{background:var(--me);margin-left:auto;border-color:transparent}
.err{color:var(--warn);font-weight:600}
.mut{color:var(--mut);font-size:14px}
img.pv{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-bottom:10px}
img.th{width:64px;height:64px;object-fit:cover;border-radius:6px}
h2{font-size:19px;margin:6px 0 12px}h3{font-size:17px;margin:0 0 6px}
.tag{display:inline-block;font-size:13px;padding:1px 9px;border:1px solid var(--bd);border-radius:99px;margin:0 6px 4px 0;color:var(--mut)}
details summary{cursor:pointer;color:var(--acc);font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<main>
<section id="p-learn">
 <div class="card">
  <div class="row">
   <label class="b">拍照或選圖<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
   <label class="b g" style="background:none;color:var(--acc);border:1px solid var(--acc)">從相簿選<input id="file2" type="file" accept="image/*" hidden></label>
   <button class="b g" id="reset">新的一題</button>
  </div>
  <p class="mut" id="hint">拍下結構式、反應機構或題目。AI 會先說明它看到了什麼，請你確認有沒有看錯。</p>
 </div>
 <div id="chat"></div>
 <div id="composer" class="card hide">
  <textarea id="q" rows="3" placeholder="說出你的想法或疑問，例如：我覺得這裡應該是 SN1，因為…"></textarea>
  <div class="row" style="margin-top:8px">
   <button class="b" id="send">送出</button>
   <button class="b g" id="sum">整理爭點並存檔</button>
  </div>
  <p class="mut" id="status"></p>
 </div>
</section>

<section id="p-book" class="hide">
 <h2>爭點本</h2>
 <div class="row" style="margin-bottom:12px">
  <input id="find" placeholder="搜尋標題、標籤、內容" style="flex:1">
  <button class="b g" id="exp">匯出</button>
 </div>
 <div id="list"></div>
</section>

<section id="p-set" class="hide">
 <h2>設定</h2>
 <div class="card">
  <p><b>API 金鑰</b><br><span class="mut">到 Google AI Studio 的「Get API key」免費建立，貼在這裡。金鑰只存在這個瀏覽器。</span></p>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off">
  <p><b>模型</b><br><span class="mut">可直接輸入模型名稱。額度用完（429）時換一個再試。</span></p>
  <input id="model" list="ml" placeholder="gemini-3-flash-preview">
  <datalist id="ml"><option value="gemini-3-flash-preview"><option value="gemini-flash-latest"><option value="gemini-pro-latest"><option value="gemini-3-pro-preview"><option value="gemini-2.5-flash"><option value="gemini-2.5-flash-lite"></datalist>
  <div class="row" style="margin-top:12px"><button class="b" id="save">儲存設定</button><span id="saved" class="mut"></span></div>
 </div>
 <div class="card"><p class="mut" style="margin:0">圖片會送到 Google 處理；免費層的內容可能被用於改進產品，請不要上傳不想外流的資料。爭點資料只存在這台裝置的瀏覽器，清除瀏覽資料會消失，請定期匯出。</p></div>
</section>
</main>
<nav><button data-t="learn" class="on">學習</button><button data-t="book">爭點本</button><button data-t="set">設定</button></nav>

<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={hist:[],thumb:null,busy:false};

const SYS=`你是有機化學家教，對象是正在自學的學生。一律使用繁體中文，用白話、生活化的比喻解釋，專有名詞第一次出現時附英文。
收到圖片時，第一步先列出「我看到的內容」：結構、官能基、箭頭與電子流向、試劑與條件；看不清楚的地方明說「不確定」，不要猜。第二步才解釋。
討論時，注意學生的想法哪裡正確、哪裡有落差。不要直接給完整答案，先指出關鍵線索並提問，讓學生自己推。`;
const SUM=`請回顧以上整段對話，找出學生「理解有落差、想錯、或反覆卡住」的爭點（最多 6 個，沒有就回傳空陣列）。
只輸出 JSON 陣列，每個元素格式：
{"title":"爭點標題","mine":"學生原本的想法","correct":"正確理解（白話）","tags":["反應類型或概念"],"quiz":"一道可自我檢驗的練習題"}
全部使用繁體中文。`;

async function call(contents,system,json){
  const k=ls.get('oc_key','');
  if(!k)throw new Error('請先到「設定」輸入 API 金鑰');
  const m=ls.get('oc_model','')||'gemini-3-flash-preview';
  const body={contents,systemInstruction:{parts:[{text:system}]}};
  if(json)body.generationConfig={responseMimeType:'application/json'};
  let r;
  try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},body:JSON.stringify(body)})}
  catch(e){throw new Error('連線失敗，請檢查網路')}
  if(r.status===404)throw new Error('找不到這個模型，請到設定換一個模型名稱（例如 gemini-flash-latest）。');
  if(r.status===429)throw new Error('額度用完（429）。請稍後再試，或到設定換一個模型。');
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((d.error&&d.error.message)||('錯誤 '+r.status));
  const p=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;
  if(!p)throw new Error('模型沒有回應內容（可能被安全機制擋下），請換個說法或換張圖');
  return p.map(x=>x.text||'').join('');
}
function shrink(file,max,q){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=URL.createObjectURL(file)})}

function render(){
  $('#chat').innerHTML=S.hist.map(h=>{
    const t=h.parts.filter(p=>p.text).map(p=>p.text).join('');
    const img=h.parts.find(p=>p.inline_data);
    if(h.role==='user')return '<div class="msg me">'+(img?'<img class="pv" src="data:image/jpeg;base64,'+img.inline_data.data+'">':'')+esc(t)+'</div>';
    return '<div class="msg">'+esc(t)+'</div>';
  }).join('');
  $('#composer').classList.toggle('hide',!S.hist.length);
  window.scrollTo(0,document.body.scrollHeight);
}
function busy(b,msg){S.busy=b;['send','sum'].forEach(i=>$('#'+i).disabled=b);$('#status').innerHTML=msg||''}
async function ask(){
  busy(true,'AI 思考中…');
  try{const t=await call(S.hist,SYS,false);S.hist.push({role:'model',parts:[{text:t}]});busy(false,'')}
  catch(e){busy(false,'<span class="err">'+esc(e.message)+'</span>')}
  render();
}
async function pick(f){
  if(!f)return;
  const url=await shrink(f,1500,.85);S.thumb=await shrink(f,160,.7);
  S.hist=[{role:'user',parts:[{inline_data:{mime_type:'image/jpeg',data:url.split(',')[1]}},{text:'請解析這張圖。'}]}];
  $('#hint').textContent='';render();ask();
}
$('#file').onchange=e=>pick(e.target.files[0]);
$('#file2').onchange=e=>pick(e.target.files[0]);
$('#reset').onclick=()=>{S.hist=[];S.thumb=null;$('#hint').textContent='拍下結構式、反應機構或題目。AI 會先說明它看到了什麼，請你確認有沒有看錯。';$('#status').textContent='';render()};
$('#send').onclick=()=>{const t=$('#q').value.trim();if(!t||S.busy)return;$('#q').value='';S.hist.push({role:'user',parts:[{text:t}]});render();ask()};
$('#sum').onclick=async()=>{
  if(S.busy||S.hist.length<2)return;
  busy(true,'整理爭點中…');
  try{
    const raw=await call([...S.hist,{role:'user',parts:[{text:SUM}]}],SYS,true);
    const arr=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(!Array.isArray(arr)||!arr.length){busy(false,'這次對話沒有找到明顯的爭點。多說說你的想法再試一次。');return}
    const book=JSON.parse(ls.get('oc_book','[]'));
    const d=new Date().toLocaleString('zh-TW');
    arr.forEach((x,i)=>book.unshift({id:Date.now()+'-'+i,date:d,thumb:S.thumb,title:x.title||'（未命名）',mine:x.mine||'',correct:x.correct||'',tags:x.tags||[],quiz:x.quiz||''}));
    const ok=ls.set('oc_book',JSON.stringify(book));
    busy(false,ok?'已存入 '+arr.length+' 個爭點，可到「爭點本」查看。':'<span class="err">儲存失敗（瀏覽器空間不足），請先匯出再刪除舊紀錄。</span>');
  }catch(e){busy(false,'<span class="err">'+esc(e.message.includes('JSON')?'AI 回傳格式有誤，請再按一次':e.message)+'</span>')}
};

function bookList(){return JSON.parse(ls.get('oc_book','[]'))}
function drawBook(){
  const f=$('#find').value.trim().toLowerCase();
  const b=bookList().filter(x=>!f||JSON.stringify(x).toLowerCase().includes(f));
  $('#list').innerHTML=b.length?b.map(x=>'<div class="card"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">'+(x.thumb?'<img class="th" src="'+x.thumb+'">':'')+'<div><h3>'+esc(x.title)+'</h3><div>'+(x.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><div class="mut">'+esc(x.date)+'</div></div></div>'
   +'<p><b>我原本的想法</b><br>'+esc(x.mine)+'</p><p><b>正確理解</b><br>'+esc(x.correct)+'</p>'
   +'<details><summary>練習題（先自己答）</summary><p>'+esc(x.quiz)+'</p></details>'
   +'<p style="margin:10px 0 0"><button class="b g" data-del="'+x.id+'">刪除</button></p></div>').join(''):'<p class="mut">還沒有爭點。到「學習」頁拍一題，討論後按「整理爭點並存檔」。</p>';
}
$('#find').oninput=drawBook;
$('#list').onclick=e=>{const id=e.target.dataset.del;if(!id||!confirm('確定刪除這個爭點？'))return;ls.set('oc_book',JSON.stringify(bookList().filter(x=>x.id!==id)));drawBook()};
$('#exp').onclick=async()=>{
  const md=bookList().map(x=>'## '+x.title+'\n日期：'+x.date+'\n標籤：'+(x.tags||[]).join('、')+'\n\n**我原本的想法**\n'+x.mine+'\n\n**正確理解**\n'+x.correct+'\n\n**練習題**\n'+x.quiz+'\n').join('\n---\n\n');
  if(!md){alert('沒有可匯出的內容');return}
  try{await navigator.clipboard.writeText(md);alert('已複製為 Markdown，可貼到筆記軟體。')}
  catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='爭點本.md';a.click()}
};
$('#key').value=ls.get('oc_key','');$('#model').value=ls.get('oc_model','');
$('#save').onclick=()=>{ls.set('oc_key',$('#key').value.trim());ls.set('oc_model',$('#model').value.trim());$('#saved').textContent='已儲存'};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['learn','book','set'].forEach(t=>$('#p-'+t).classList.toggle('hide',t!==b.dataset.t));
  if(b.dataset.t==='book')drawBook();
});
</script>
</body>
</html>
